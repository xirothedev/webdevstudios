name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'apps/api/**'
              - 'apps/web/**'
              - 'apps/api-elysia/**'
              - 'packages/**'
              - 'turbo.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            go:
              - 'apps/api-go/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-node
      - run: bunx --bun --no-install turbo run lint
      - run: bun run format:check
      - run: bun run lint:boundaries

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-node
      - run: bunx --bun --no-install turbo run test

  build:
    name: Build
    needs: [changes, lint, test]
    if: needs.changes.outputs.app == 'true' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun-node
      - run: bunx --bun --no-install turbo run build

  go-test:
    name: Go Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Run Go tests
        working-directory: apps/api-go
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/wds_test
        run: |
          go build ./...
          go test ./... -count=1
