name: Setup bun + Node
description: >
  Shared setup for CI jobs: bun install with frozen lockfile (postinstall
  runs api's prisma generate). Assumes actions/checkout already ran in the
  calling job.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        # ponytail: pin to the version that wrote bun.lock — 'latest' drifts and breaks --frozen-lockfile
        bun-version: 1.3.14
    - run: bun install --frozen-lockfile
      shell: bash
