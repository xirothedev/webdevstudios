name: Setup bun + Node
description: >
  Shared setup for CI jobs: bun install with frozen lockfile (postinstall
  runs api's prisma generate). Assumes actions/checkout already ran in the
  calling job.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        # ponytail: pin to the version that wrote bun.lock — 'latest' drifts and breaks --frozen-lockfile
        bun-version: 1.3.14
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: apps/api-axum -> target
    - run: bun install --frozen-lockfile
      shell: bash
    # Turbo's local task cache shared across jobs and runs; turbo validates
    # task hashes itself, so stale entries are harmless
    - uses: actions/cache@v6
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: turbo-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ github.job }}-
