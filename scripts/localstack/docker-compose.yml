# AWS giả lập (https://github.com/localstack/localstack) — chạy trên xiroserver-lan
# docker compose up -d  → endpoint: http://xiroserver-lan:4566
name: localstack

services:
  localstack:
    # 4.4 = last free community release; :latest and service tags became Pro-with-auth images in 2026.03
    image: localstack/localstack:4.4
    ports:
      - '4566:4566' # single edge port cho mọi service
    environment:
      - SERVICES=s3
      - DEBUG=0
    volumes:
      - './init:/etc/localstack/init/ready.d' # chạy sau khi edge sẵn sàng
      - 'localstack-data:/var/lib/localstack'
    healthcheck:
      test: ['CMD', 'awslocal', 's3', 'ls']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  localstack-data:
