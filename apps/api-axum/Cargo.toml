[package]
name = "api-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1.144.0"
aws-types = "1"
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hex = "0.4"
hmac = "0.12"
jsonwebtoken = "9"
lettre = { version = "0.11.23", default-features = false, features = [
    "tokio1",
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
    "hostname",
    "pool",
] }
rand = "0.8"
redis = { version = "1.6.0", features = ["tokio-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "multipart"] }
rust_decimal = { version = "1.42.1", features = ["serde"] }
sea-orm = { version = "2", features = ["macros", "mock", "sqlx-postgres", "runtime-tokio-rustls", "serde", "with-chrono", "with-rust_decimal", "with-uuid", "with-json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth", "qr"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
